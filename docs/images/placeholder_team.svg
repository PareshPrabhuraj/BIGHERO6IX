<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#232730"/>
      <stop offset="100%" stop-color="#181B22"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#2D323F" stroke-width="1" opacity="0.6"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#grad)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  
  <!-- Dashed Border -->
  <rect x="24" y="24" width="752" height="452" rx="18" fill="none" stroke="#4B5563" stroke-width="2" stroke-dasharray="10 8" opacity="0.7"/>
  
  <!-- Camera / Placeholder Icon -->
  <g transform="translate(360, 140)">
    <rect x="-40" y="-30" width="80" height="60" rx="10" fill="#2D323F" stroke="#6B7280" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="16" fill="#1F232B" stroke="#00F0FF" stroke-width="3"/>
    <circle cx="-24" cy="-16" r="4" fill="#10B981"/>
    <path d="M -15 -30 L -8 -40 L 8 -40 L 15 -30 Z" fill="#2D323F" stroke="#6B7280" stroke-width="2"/>
  </g>
  
  <!-- Primary Headline -->
  <text x="400" y="250" text-anchor="middle" fill="#F3F4F6" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="2">
    REPLACE IMAGE HERE
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="290" text-anchor="middle" fill="#9CA3AF" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">
    Competition Day Team Photograph
  </text>
  
  <text x="400" y="320" text-anchor="middle" fill="#00F0FF" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1">
    Simar Singh · Gavin Huang · John Barojas · Paresh Prabhu Raj
  </text>
  
  <!-- File Destination Tag -->
  <g transform="translate(400, 375)">
    <rect x="-180" y="-18" width="360" height="36" rx="18" fill="#111318" stroke="#374151" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" fill="#6EE7B7" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">
      Drop image into: docs/images/team_photo.jpg
    </text>
  </g>
</svg>